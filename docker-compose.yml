services:
  postgres:
    image: postgres:17-alpine
    container_name: roms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: roms
      POSTGRES_PASSWORD: roms
      POSTGRES_DB: roms
    ports:
      - '5432:5432'
    volumes:
      - roms-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U roms -d roms']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: roms-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - roms-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  roms-postgres-data:
  roms-redis-data:
